<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa Ganadora</title>
  <style>
    :root {
	  --bg: #f5edeb;
	  --card: #f5edeb;
	  --text: #c37978;
	  --text-muted: #9f7670;
	  --accent: #edc5bd;
	  --accent-hover: #eca9a3;
	  --border: #e0d1cc;
	  --winner-bg: #faf2f0;
	  --winner-border: #f0afa8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      margin: auto;
      text-align: center;
    }

    /* Main Showcase Box */
    .winner-card {
      background-color: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.25rem;
      transition: all 0.3s ease;
    }

    .winner-card.is-winner {
      background-color: var(--winner-bg);
      border-color: var(--winner-border);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
    }

    .label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .display-code {
      font-family: ui-monospace, SFMono-Regular, Monaco, Consolas, monospace;
      font-size: 3.25rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.05em;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
    }

    /* Action Button */
    .btn-draw {
      display: block;
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-bottom: 1.5rem;
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .btn-draw:disabled {
      background-color: #cbd5e1;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Winners Summary Box */
    .winners-summary {
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .summary-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .winner-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.35rem 0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .winner-row:last-child {
      border-bottom: none;
    }

    .winner-place {
      font-weight: 600;
      color: var(--text-muted);
    }

    .winner-val {
      font-family: ui-monospace, SFMono-Regular, Monaco, Consolas, monospace;
      font-weight: 700;
      color: var(--accent);
    }

    /* Pool Breakdown Table */
    .table-container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }

    .table-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0.85rem;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    td {
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.eliminated {
      background-color: #f1f5f9;
      opacity: 0.5;
      text-decoration: line-through;
    }

    .code-cell {
      font-family: ui-monospace, SFMono-Regular, Monaco, Consolas, monospace;
      font-weight: 700;
      color: var(--accent);
    }

    .center-align {
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Winner Showcase Box -->
    <div class="winner-card" id="card">
      <div class="label" id="status-label">Sorteo 1 de 3: Primer Premio</div>
      <div class="display-code" id="display">BR-??????</div>
    </div>

    <!-- Draw Button -->
    <button type="button" class="btn-draw" id="draw-btn" onclick="startRoll()">
      ELIGE AL GANADOR DEL PRIMER PREMIO
    </button>

    <!-- Winners Podium Summary -->
    <div class="winners-summary">
      <div class="summary-title">Premios y Ganadores</div>
      <div class="winner-row">
        <span class="winner-place">Primer Premio:</span>
        <span class="winner-val" id="res-1">---</span>
      </div>
      <div class="winner-row">
        <span class="winner-place">Segundo Premio:</span>
        <span class="winner-val" id="res-2">---</span>
      </div>
      <div class="winner-row">
        <span class="winner-place">Tercer Premio:</span>
        <span class="winner-val" id="res-3">---</span>
      </div>
    </div>

    <!-- Entries Table -->
    <div class="table-container">
      <div class="table-title">Participantes</div>
      <table>
        <thead>
          <tr>
            <th>Ticket</th>
            <th class="center-align">Oportunidades</th>
            <th class="center-align">Probabilidad</th>
          </tr>
        </thead>
        <tbody id="tickets-table-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const poolData = [
	{ code: "BR-5D67BB", chances: 1},
	{ code: "BR-586E08", chances: 1},
	{ code: "BR-7D8F48", chances: 10},
	{ code: "BR-7EA51A", chances: 1},
	{ code: "BR-6C265D", chances: 1},
	{ code: "BR-F7FD57", chances: 1},
	{ code: "BR-03B8C0", chances: 1},
	{ code: "BR-26A9AA", chances: 2},
	{ code: "BR-21CB5A", chances: 1},
	{ code: "BR-6592C6", chances: 2},
	{ code: "BR-4FAA42", chances: 1},
	{ code: "BR-565719", chances: 1},
	{ code: "BR-3357D3", chances: 1},
	{ code: "BR-2BFD9D", chances: 1},
	{ code: "BR-C1FC87", chances: 1},
	{ code: "BR-EB4ACF", chances: 1},
	{ code: "BR-0D41F9", chances: 1},
    ];

    poolData.sort((a, b) => b.chances - a.chances);

    const prizeTitles = [
      "Primer Premio",
      "Segundo Premio",
      "Tercer Premio"
    ];

    let currentDrawIndex = 0; // Tracks 0, 1, 2
    let activePool = [...poolData]; // Holds remaining un-drawn tickets

    // Render / Refresh Table with updated odds
    function renderTable() {
      const tbody = document.getElementById('tickets-table-body');
      tbody.innerHTML = '';

      let totalRemainingChances = 0;
      activePool.forEach(item => totalRemainingChances += item.chances);

      poolData.forEach(item => {
        const isDrawn = !activePool.some(active => active.code === item.code);
        const row = document.createElement('tr');
        
        if (isDrawn) {
          row.classList.add('eliminated');
          row.innerHTML = `
            <td class="code-cell">${item.code}</td>
            <td class="center-align">${item.chances}</td>
            <td class="center-align">GANADOR</td>
          `;
        } else {
          const percentage = ((item.chances / totalRemainingChances) * 100).toFixed(1);
          row.innerHTML = `
            <td class="code-cell">${item.code}</td>
            <td class="center-align">${item.chances}</td>
            <td class="center-align">${percentage}%</td>
          `;
        }
        tbody.appendChild(row);
      });
    }

    renderTable();

    // Roll Logic
    function startRoll() {
      if (currentDrawIndex >= 3 || activePool.length === 0) return;

      const btn = document.getElementById('draw-btn');
      const display = document.getElementById('display');
      const label = document.getElementById('status-label');
      const card = document.getElementById('card');

      btn.disabled = true;
      card.classList.remove('is-winner');
      label.textContent = `Eligiendo ${prizeTitles[currentDrawIndex]}...`;

      // Build array of remaining codes weighted by their remaining chances
      let weightedPool = [];
      activePool.forEach(item => {
        for (let i = 0; i < item.chances; i++) {
          weightedPool.push(item.code);
        }
      });


function getCryptoRandomInt(max) {
  const array = new Uint32Array(1);
  window.crypto.getRandomValues(array);
  return array[0] % max;
}

const winningCode = weightedPool[getCryptoRandomInt(weightedPool.length)];


      let counter = 0;
      let delay = 15;
      const totalSteps = 60;

      function step() {
        display.textContent = weightedPool[Math.floor(Math.random() * weightedPool.length)];
        counter++;

        if (counter < totalSteps) {
          if (counter > totalSteps - 20) delay += 10;
          if (counter > totalSteps - 10) delay += 35;
          if (counter > totalSteps - 4) delay += 120;
          setTimeout(step, delay);
        } else {
          // Reveal Winner
          display.textContent = winningCode;
          label.textContent = `🎉 ${prizeTitles[currentDrawIndex]} 🎉`;
          card.classList.add('is-winner');

          // Update Summary List
          document.getElementById(`res-${currentDrawIndex + 1}`).textContent = winningCode;

          // Remove winner from active pool
          activePool = activePool.filter(item => item.code !== winningCode);
          
          // Re-render table to recalculate remaining odds & strike out the winner
          renderTable();

          currentDrawIndex++;

          // Update Button State for Next Draw
          if (currentDrawIndex < 3 && activePool.length > 0) {
            btn.disabled = false;
            btn.textContent = `ELIGE AL GANADOR DEL ${currentDrawIndex === 1 ? 'SEGUNDO' : 'TERCER'} PREMIO`;

            // Brief pause before updating top label for next draw
            setTimeout(() => {
              if (!card.classList.contains('is-winner')) return; 
            }, 1000);
          } else {
            btn.disabled = true;
            btn.textContent = "TODOS LOS GANADORES SELECCIONADOS";
          }
        }
      }

      step();
    }
  </script>

</body>
</html>
